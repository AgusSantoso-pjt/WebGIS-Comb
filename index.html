        var autolinker = new Autolinker({ truncate: { length: 30, location: 'smart' } });
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            if (tempDiv.querySelector('td img')) {
                popup._contentNode.classList.add('media');
                // Delay to force the redraw
                setTimeout(function () {
                    popup.update();
                }, 10);
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        L.control.locate({ locateOptions: { maxZoom: 19 } }).addTo(map);

        function updateSidebar(title, dataObj, id) {
            let tableHtml = `<h5>${title}</h5><table class="table table-bordered table-sm">`;
            let chartVal = null;
            let chartLabel = '';

            for (let key in dataObj) {
                const val = dataObj[key];
                // buat <tr> klikable dan beri data-id
                tableHtml += `<tr class="clickable-row" data-id="${id}"><th>${key}</th><td>${val ?? '-'}</td></tr>`;

                // tangkap angka pertama buat chart
                if (chartVal === null && typeof val === 'number') {
                    chartVal = val;
                    chartLabel = key;
                }
            }

            tableHtml += `</table>`;
            document.getElementById('infoTable').innerHTML = tableHtml;

            // Chart.js
            const ctx = document.getElementById('infoChart').getContext('2d');
            if (window.myChart) window.myChart.destroy();
            if (chartVal !== null) {
                window.myChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: [chartLabel],
                        datasets: [{
                            label: chartLabel,
                            data: [chartVal],
                            backgroundColor: 'rgba(75, 192, 192, 0.6)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            title: { display: false }
                        },
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            }

            // Tambahkan event click ke setiap baris
            setTimeout(() => {
                document.querySelectorAll('.clickable-row').forEach(row => {
                    row.addEventListener('click', () => {
                        const targetId = row.getAttribute('data-id');
                        const layer = polygonFeatureMap.get(Number(targetId));
                        if (layer) {
                            map.fitBounds(layer.getBounds());
                            layer.openPopup();
                        }
                    });
                });
            }, 100);
        }
    </script>
